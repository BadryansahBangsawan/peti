[package]
name = "peti"
version = "0.1.1"
description = "Peti"
edition = "2024"
rust-version = "1.90"

[lib]
name = "peti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
tauri = { version = "2.12.3", features = [] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
keyring = "4.2.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
